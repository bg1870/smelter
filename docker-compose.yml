# =============================================================================
# Smelter Docker Compose - AWS NVIDIA EC2 Production
# =============================================================================
#
# Usage:
#   docker-compose up -d                    # Start in background
#   docker-compose logs -f smelter          # View logs
#   docker-compose down                     # Stop
#
# AWS EC2 Requirements:
#   - NVIDIA GPU instance (g4dn, g5, p3, p4, etc.)
#   - NVIDIA Container Toolkit installed
#   - Docker configured with nvidia runtime
#

services:
  smelter-server1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: stable
    image: smelter:latest
    container_name: smelter-server1
    restart: unless-stopped

    # GPU Configuration
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
                - compute
                - utility
                - video
                - graphics

    # Internal ports only (no host bindings)
    expose:
      - "8081" # HTTP API
      - "9000" # WHIP/WHEP
      - "1935" # RTMP ingest (nginx-rtmp pushes here)

    environment:
      - SMELTER_API_PORT=8081
      - SMELTER_WHIP_WHEP_SERVER_PORT=9000
      - SMELTER_START_WHIP_WHEP_SERVER=true
      - SMELTER_STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302

      - SMELTER_FORCE_GPU=true
      - SMELTER_GPU_DEVICE_DRIVER=nvidia
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video

      - SMELTER_WEB_RENDERER_ENABLE=true
      - SMELTER_WEB_RENDERER_GPU_ENABLE=true
      - SMELTER_OUTPUT_FRAMERATE=30
      - SMELTER_MIXING_SAMPLE_RATE=48000
      - SMELTER_LOAD_SYSTEM_FONTS=true

      - SMELTER_INPUT_BUFFER_DURATION_MS=500
      - SMELTER_STREAM_FALLBACK_TIMEOUT_MS=2000
      - SMELTER_NEVER_DROP_OUTPUT_FRAMES=false

      - SMELTER_LOGGER_FORMAT=json
      - SMELTER_LOGGER_LEVEL=info,wgpu_hal=warn,wgpu_core=warn,webrtc_srtp::session=warn,naga=warn
      - SMELTER_FFMPEG_LOGGER_LEVEL=warn

    volumes:
      - smelter-server1-downloads:/home/smelter/smelter/downloads
      - smelter-server1-cache:/home/smelter/smelter/.cache
      - smelter-server1-logs:/home/smelter/smelter/logs
      # Mount NVIDIA Vulkan ICD files from host
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Traefik routing (Traefik must be on stream_net too)
    labels:
      - "traefik.enable=true"

      # API (8081) -> https://YOUR_DOMAIN/server1
      - "traefik.http.routers.smelter-server1-api.rule=Host(`YOUR_DOMAIN`) && PathPrefix(`/server1`)"
      - "traefik.http.routers.smelter-server1-api.entrypoints=websecure"
      - "traefik.http.routers.smelter-server1-api.tls=true"
      - "traefik.http.middlewares.smelter-server1-api-strip.stripprefix.prefixes=/server1"
      - "traefik.http.routers.smelter-server1-api.middlewares=smelter-server1-api-strip"
      - "traefik.http.services.smelter-server1-api.loadbalancer.server.port=8081"

      # WHIP/WHEP (9000) -> https://YOUR_DOMAIN/server1-webrtc
      - "traefik.http.routers.smelter-server1-webrtc.rule=Host(`YOUR_DOMAIN`) && PathPrefix(`/server1-webrtc`)"
      - "traefik.http.routers.smelter-server1-webrtc.entrypoints=websecure"
      - "traefik.http.routers.smelter-server1-webrtc.tls=true"
      - "traefik.http.middlewares.smelter-server1-webrtc-strip.stripprefix.prefixes=/server1-webrtc"
      - "traefik.http.routers.smelter-server1-webrtc.middlewares=smelter-server1-webrtc-strip"
      - "traefik.http.services.smelter-server1-webrtc.loadbalancer.server.port=9000"

    networks:
      - stream_net

volumes:
  smelter-server1-downloads:
  smelter-server1-cache:
  smelter-server1-logs:

networks:
  stream_net:
    external: true
